services:
  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-common_foundation}
      POSTGRES_USER: ${POSTGRES_USER:-common_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-common_app_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: common-foundation-backend:0.1.0
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-common_foundation}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-common_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-common_app_password}
      FILE_STORAGE_ROOT: /var/lib/common-foundation/attachments
    volumes:
      - attachment-files:/var/lib/common-foundation/attachments
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    image: common-foundation-frontend:0.1.0
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres-data:
  attachment-files:
