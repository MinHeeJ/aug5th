openapi: 3.0.3
info:
  title: 공통기능 1차 완료 목표 API
  version: 0.1.0
  description: 한국교원대학교 교수업적평가시스템 시스템 관리 영역의 1차 공통기능 HTTP API 계약
servers:
- url: /
  description: 브라우저 상대경로 /api/... 기준
paths:
  /api/health:
    get:
      operationId: health
      summary: 서비스 상태
      x-related-requirements:
      - REQ-074
      - REQ-079
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/auth/login:
    post:
      operationId: login
      summary: 로그인
      x-related-requirements:
      - REQ-061
      - REQ-062
      - REQ-069
      - REQ-059
      - REQ-060
      - REQ-068
      - REQ-074
      - REQ-077
      - REQ-079
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 검증 오류
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      x-business-rules:
      - admin/admin 시드 계정은 Docker Compose 직후 로그인 가능해야 한다
      - 내부 계정 adapter만 사용하고 실제 SSO를 호출하지 않는다
      x-side-effects:
      - user_sessions 레코드를 active 상태로 저장한다
      - HttpOnly SameSite=Lax 세션 쿠키를 발급한다
      x-required-tests:
      - 'happy: 유효한 로그인 요청 -> 관련 table 재조회에서 login 저장 결과가 확인된다'
      - 'auth: R09가 아닌 인증 사용자 또는 미인증 사용자 -> 401 또는 403 ApiError가 반환된다'
      - 'validation: 필수 식별자 또는 원문 필드가 누락된 입력 -> ApiError.fields에 해당 field 오류가 포함된다'
      - 'business: admin/admin 시드 계정은 Docker Compose 직후 로그인 가능해야 한다 위반 -> 대상 table 상태가 변경되지 않는다'
      - 'side-effect: user_sessions 레코드를 active 상태로 저장한다 후 변경 추적 근거를 재조회할 수 있다'
      x-state-transitions:
      - absent -> active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      x-related-requirements:
      - REQ-063
      - REQ-069
      - REQ-064
      - REQ-071
      - REQ-077
      - REQ-079
      responses:
        '200':
